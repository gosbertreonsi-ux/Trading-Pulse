name: Market data integration

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-integration.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-integration.yml"

permissions:
  contents: read

jobs:
  postgres-redis-flow:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: trading_pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trading_pulse_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/trading_pulse_test
      REDIS_URL: redis://127.0.0.1:6379
      TRADING_PULSE_API_TOKEN: integration-only-signing-secret-do-not-use-in-production-2026
      RUN_TRADING_PULSE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply all committed migrations to disposable test database
        run: npx prisma migrate deploy
      - name: Test authenticated ingestion through real Postgres Redis and candle API
        run: npx tsx --test src/integration/marketFlow.test.ts src/integration/liveStream.test.ts
