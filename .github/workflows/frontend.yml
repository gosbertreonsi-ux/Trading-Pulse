name: Frontend review checks

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Type-check frontend
        run: npx tsc --noEmit
      - name: Test chart crossover indicators
        run: node --experimental-strip-types --test tests/chartSignals.test.mjs
      - name: Test local diagnostic classifications
        run: node --experimental-strip-types --test tests/devDiagnostics.test.mjs
      - name: Test synthetic preview candles
        run: node --experimental-strip-types --test tests/demoCandles.test.mjs
      - name: Build frontend
        run: npm run build
      - name: Install ephemeral browser test dependency
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Verify dashboard in desktop and mobile Chrome
        run: node tests/layoutSmoke.mjs
      - name: Attach browser layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broker-layout-smoke
          path: |
            frontend/broker-desktop.png
            frontend/broker-desktop-light.png
            frontend/broker-mobile.png
            frontend/broker-mobile-light.png
            frontend/studio-desktop-light.png
          if-no-files-found: ignore
